name: Deploy AI Aircraft Maintenance Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '644272928959' }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'SVORA-AI_AIRCRAFT_MANAGEMENT' }}
      BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE || format('{0}.dkr.ecr.{1}.amazonaws.com/backend-api-maintenance:latest', secrets.AWS_ACCOUNT_ID || '644272928959', secrets.AWS_REGION || 'ap-southeast-2') }}
      FRONTEND_IMAGE: ${{ secrets.FRONTEND_IMAGE || format('{0}.dkr.ecr.{1}.amazonaws.com/maintenance-frontend:latest', secrets.AWS_ACCOUNT_ID || '644272928959', secrets.AWS_REGION || 'ap-southeast-2') }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://a8a94145817e34fa1b1e8b4238d60b21-1786539109.ap-southeast-2.elb.amazonaws.com' }}

    steps:
      # ----------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Configure AWS Credentials
      # ----------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------
      # Build & Push Backend Docker Image
      # ----------------------------------------------------
      - name: Build and Push Backend Image
        run: |
          docker build -t backend-api-maintenance ./backend
          docker tag backend-api-maintenance:latest $BACKEND_IMAGE
          docker push $BACKEND_IMAGE

      # ----------------------------------------------------
      # Configure & Build Frontend Image
      # ----------------------------------------------------
      - name: Inject Frontend API URL
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > ./frontend/.env

      - name: Build and Push Frontend Image
        run: |
          docker build -t maintenance-frontend ./frontend
          docker tag maintenance-frontend:latest $FRONTEND_IMAGE
          docker push $FRONTEND_IMAGE

      # ----------------------------------------------------
      # Configure kubectl for Amazon EKS
      # ----------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ----------------------------------------------------
      # Update Image Tags in Manifests
      # ----------------------------------------------------
      - name: Update Manifests
        run: |
          sed -i "s|\${BACKEND_IMAGE}|$BACKEND_IMAGE|g" kubernetes/backend-deployment.yaml
          sed -i "s|\${FRONTEND_IMAGE}|$FRONTEND_IMAGE|g" kubernetes/frontend-deployment.yaml

      # ----------------------------------------------------
      # Create / Update Kubernetes Secret
      # ----------------------------------------------------
      - name: Create or Update AWS Credentials Secret
        run: |
          kubectl create secret generic aws-credentials \
            --from-literal=AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --from-literal=AWS_REGION=${{ env.AWS_REGION }} \
            --from-literal=ALLOW_FALLBACK=true \
            --dry-run=client -o yaml | kubectl apply -f -

      # ----------------------------------------------------
      # Deploy Kubernetes Manifests
      # ----------------------------------------------------
      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f kubernetes/backend-deployment.yaml
          kubectl apply -f kubernetes/backend-service.yaml
          kubectl apply -f kubernetes/frontend-deployment.yaml
          kubectl apply -f kubernetes/frontend-service.yaml

      # ----------------------------------------------------
      # Verify Deployment Rollout
      # ----------------------------------------------------
      - name: Wait for Rollout Completion
        run: |
          kubectl rollout status deployment/backend-api-maintenance --timeout=120s
          kubectl rollout status deployment/frontend-maintenance --timeout=120s

      - name: List Cluster Status
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get svc
