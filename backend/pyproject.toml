[project]
name = "ai-aircraft-maintenance-platform"
version = "0.1.0"
description = "S.V.O.R.A Aircraft Maintenance Intelligence Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.110.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
