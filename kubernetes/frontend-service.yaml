# -----------------------------------------------------------------------------
# Frontend Service — S.V.O.R.A Aircraft Maintenance Dashboard
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: frontend-maintenance
  labels:
    app: frontend-maintenance
spec:
  selector:
    app: frontend-maintenance
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
