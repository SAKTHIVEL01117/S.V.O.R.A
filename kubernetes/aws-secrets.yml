# -----------------------------------------------------------------------------
# Kubernetes Secret Template — AWS Credentials & Environment
#
# IMPORTANT:
# - For local manual deployment: replace the placeholder values below and run:
#     kubectl apply -f kubernetes/aws-secrets.yml
# - For GitHub Actions CI/CD: secrets are automatically created at runtime
#   from your GitHub Repository Secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY).
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  labels:
    app: backend-api-maintenance
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_ACCESS_KEY"
  AWS_REGION: "ap-southeast-2"
  BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"
  ALLOW_FALLBACK: "true"
  MOCK_BEDROCK: "false"
