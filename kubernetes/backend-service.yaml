# -----------------------------------------------------------------------------
# Backend Service — S.V.O.R.A Aircraft Maintenance API
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: backend-api-maintenance
  labels:
    app: backend-api-maintenance
spec:
  selector:
    app: backend-api-maintenance
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
